[package]
name = "kivc-codegen"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
text-size = { workspace = true }

kivc-span = { workspace = true }
kivc-diagnostics = { workspace = true }
kivc-ast = { workspace = true }
kivc-mir = { workspace = true }
kivc-typeck = { workspace = true }
kivc-hir = { workspace = true }

[features]
default = []
llvm = ["dep:inkwell"]

[dependencies.inkwell]
version = "0.6"
features = ["llvm18-1"]
default-features = false
optional = true

[dev-dependencies]
kivc-parser = { workspace = true }
