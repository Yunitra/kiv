name: CI

on:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Install LLVM
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-18 clang-18
        echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    
    - name: Run tests
      run: cargo test --workspace
    
    - name: Build
      run: cargo build --workspace --release

  build-cross-platform:
    name: Build Cross-Platform
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kiv-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kiv-windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kiv-macos-x64
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Install LLVM (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-18 clang-18
        echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
        
    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install llvm --version=18.1.8 --allow-downgrade --force
        echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH
        
    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm@18
        echo "/usr/local/opt/llvm@18/bin" >> $GITHUB_PATH
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build release
      run: cargo build --release --target ${{ matrix.target }} --bin kiv
    
    - name: Prepare artifact
      shell: bash
      run: |
        mkdir -p dist
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          cp target/${{ matrix.target }}/release/kiv.exe dist/
        else
          cp target/${{ matrix.target }}/release/kiv dist/
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist/
        retention-days: 30
